    <script>
      (function() {
        // Intercept Vite HMR WebSocket so it is in OPEN state immediately and never fails
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          class ViteMockWebSocket extends EventTarget {
            static CONNECTING = 0;
            static OPEN = 1;
            static CLOSING = 2;
            static CLOSED = 3;

            CONNECTING = 0;
            OPEN = 1;
            CLOSING = 2;
            CLOSED = 3;

            readyState = 1; // WebSocket.OPEN
            url = '';
            protocol = '';
            extensions = '';
            binaryType = 'blob';
            bufferedAmount = 0;

            onopen = null;
            onmessage = null;
            onerror = null;
            onclose = null;

            constructor(url, protocols) {
              super();
              this.url = String(url);
              this.protocol = Array.isArray(protocols) ? protocols[0] || '' : (protocols || '');
              queueMicrotask(() => {
                const ev = new Event('open');
                if (typeof this.onopen === 'function') this.onopen(ev);
                this.dispatchEvent(ev);
              });
            }

            send() {}
            close(code, reason) {
              this.readyState = 3;
              const ev = new CloseEvent('close', { code: code || 1000, reason: reason || '', wasClean: true });
              if (typeof this.onclose === 'function') this.onclose(ev);
              this.dispatchEvent(ev);
            }
          }

          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            if (urlStr.includes('vite') || urlStr.includes('token=') || protocols === 'vite-hmr') {
              return new ViteMockWebSocket(url, protocols);
            }
            try {
              return new NativeWebSocket(url, protocols);
            } catch {
              return new ViteMockWebSocket(url, protocols);
            }
          };

          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = ViteMockWebSocket.prototype;
        }

        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => (typeof a === 'object' && a !== null ? (a.message || a.stack || String(a)) : String(a))).join(' ');
          if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          const msg = e.message || (e.error && e.error.message) || '';
          if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (reason.includes('WebSocket') || reason.includes('ws://') || reason.includes('wss://')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
